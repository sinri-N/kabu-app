<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="分身体">
<meta name="theme-color" content="#2b4a7a">
<title>分身体</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* レイアウト: 上にタイトルと更新時刻、本文は1列(PCでは幅を絞って中央)、下に固定のタブ4つ(ホーム/記録/設定/実行)。スマホ優先 */
:root {
  --bg: #f3f2ee; --panel: #fbfaf7; --ink: #1d2433; --mute: #667085; --line: #dedbd2;
  --accent: #2b4a7a; --on-accent: #ffffff; --gain: #b3382c; --loss: #2563a8;
  --ok: #2f7a4d; --warn-bg: #fbeeda; --warn-ink: #7a4a05; --err-bg: #f8dcd8; --err-ink: #8a2a20;
  --c1: #2b4a7a; --c2: #c27a1a; --c3: #8a8f99; --c4: #3a8a6a;
  --sans: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151922; --panel: #1c212c; --ink: #e6e8ee; --mute: #98a1b2; --line: #2d3443;
  --accent: #8fb0e6; --on-accent: #101626; --gain: #ef7d70; --loss: #7fb2ee;
  --ok: #7ccb98; --warn-bg: #3a2c12; --warn-ink: #f0c987; --err-bg: #3f1f1b; --err-ink: #f2a79e;
  --c1: #8fb0e6; --c2: #e0a04a; --c3: #8f97a6; --c4: #6fcf9f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #151922; --panel: #1c212c; --ink: #e6e8ee; --mute: #98a1b2; --line: #2d3443;
  --accent: #8fb0e6; --on-accent: #101626; --gain: #ef7d70; --loss: #7fb2ee;
  --ok: #7ccb98; --warn-bg: #3a2c12; --warn-ink: #f0c987; --err-bg: #3f1f1b; --err-ink: #f2a79e;
  --c1: #8fb0e6; --c2: #e0a04a; --c3: #8f97a6; --c4: #6fcf9f; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; overscroll-behavior-y: contain; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6;
  padding-block: calc(68px + env(safe-area-inset-top, 0px)) calc(32px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
h2 { font-size: 13px; margin: 0 0 8px; color: var(--mute); letter-spacing: .12em; font-weight: 500; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.gain { color: var(--gain); } .loss { color: var(--loss); } .mute { color: var(--mute); }
.sub { margin: 0; color: var(--mute); font-size: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); min-width: 0; }
.row:first-of-type { border-top: 0; }
.row > :first-child { min-width: 0; overflow-wrap: anywhere; }
.row > :last-child { text-align: right; min-width: 0; overflow-wrap: anywhere; }
.row .num { white-space: nowrap; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
.card .big { font-size: 20px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.card small { color: var(--mute); display: block; overflow-wrap: anywhere; }
.note { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.news details { border-top: 1px solid rgba(128,128,128,.35); margin-top: 8px; }
.news summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; font-weight: 500; }
.news summary small { white-space: nowrap; font-weight: 400; }
.news .nl { font-size: 13px; padding: 4px 0; white-space: normal; }
.news > small.nl { display: block; margin-top: 8px; }
.err { background: var(--err-bg); color: var(--err-ink); border-radius: 8px; padding: 10px 12px; overflow-wrap: anywhere; }
.okmsg { background: var(--panel); border: 1px solid var(--ok); color: var(--ok); border-radius: 8px; padding: 10px 12px; overflow-wrap: anywhere; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--mute); min-width: 0; }
input, select, textarea, button { font: inherit; color: var(--ink); }
input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; width: 100%; font-size: 16px; }
textarea { font-family: var(--mono); font-size: 13px; min-height: 52vh; line-height: 1.5; white-space: pre; overflow-x: auto; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; min-height: 44px; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.form { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { padding: 10px 4px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg2 button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); }
.chip.success { color: var(--ok); border-color: var(--ok); } .chip.failure { color: var(--err-ink); border-color: var(--err-ink); }
.chip.run { color: var(--warn-ink); border-color: var(--warn-ink); }
.bar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; gap: 4px; height: calc(52px + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) 12px 0 max(8px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
.bar #menuBtn { border: 0; background: transparent; width: 44px; padding: 0; display: grid; place-items: center; }
.bar #menuBtn svg { width: 24px; height: 24px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; }
.bar h1 { white-space: nowrap; }
.find { position: relative; flex: 1; min-width: 0; max-width: 260px; margin-left: auto; }
.find input { padding: 7px 12px; border-radius: 99px; }
.res { position: absolute; right: 0; top: calc(100% + 8px); width: min(360px, calc(100vw - 24px)); max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.hit { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); }
.hit:first-child { border-top: 0; }
.hit .who { min-width: 0; overflow-wrap: anywhere; }
.hit .acts { display: flex; gap: 6px; flex-shrink: 0; }
.btn { display: inline-flex; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-height: 40px; color: var(--ink); text-decoration: none; font-size: 14px; cursor: pointer; }
.btn.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.res .empty { padding: 12px; color: var(--mute); }
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4); opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; z-index: 40; width: min(280px, 80vw); background: var(--panel); border-right: 1px solid var(--line);
  padding: calc(16px + env(safe-area-inset-top, 0px)) 0 16px; transform: translateX(-100%); visibility: hidden; transition: transform .2s, visibility .2s; display: flex; flex-direction: column; }
.drawer h2 { padding: 0 20px 12px; margin: 0; }
.drawer button { border: 0; border-radius: 0; background: transparent; text-align: left; padding: 12px 20px; min-height: 52px; font-size: 16px; }
.drawer button[aria-current="page"] { color: var(--accent); font-weight: 700; background: var(--bg); box-shadow: inset 3px 0 0 var(--accent); }
body.menu-open .scrim { opacity: 1; visibility: visible; }
body.menu-open .drawer { transform: none; visibility: visible; }
#ptr { position: fixed; left: 50%; top: calc(52px + env(safe-area-inset-top, 0px)); z-index: 10; width: 36px; height: 36px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line);
  display: grid; place-items: center; opacity: 0; transform: translate(-50%, -48px); pointer-events: none; color: var(--accent); }
#ptr.snap { transition: transform .2s, opacity .2s; }
#ptr svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
#ptr.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ac { position: relative; }
.sug { position: absolute; left: 0; right: 0; top: 100%; z-index: 5; margin-top: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.18); overflow: hidden; }
.sug button { display: flex; justify-content: space-between; gap: 12px; width: 100%; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; text-align: left; min-height: 44px; }
.sug button:first-child { border-top: 0; }
.order { display: flex; flex-direction: column; gap: 6px; }
.order .row { padding: 4px 0; align-items: center; }
.order .row > :last-child { display: flex; gap: 6px; }
.order button { min-height: 36px; padding: 4px 10px; }
svg text { fill: var(--mute); font-family: var(--mono); font-size: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 3px; margin-right: 5px; vertical-align: middle; }
@media (prefers-reduced-motion: no-preference) { .panel, .card { transition: border-color .15s; } }
</style>
</head>
<body>
<header class="bar">
  <button id="menuBtn" aria-label="メニュー" hidden><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <h1 id="title">分身体</h1>
  <div class="find" id="find" hidden>
    <input id="q" type="search" placeholder="銘柄検索" autocomplete="off" enterkeyhint="search" aria-label="銘柄検索">
    <div id="res" class="res" hidden></div>
  </div>
</header>
<div id="scrim" class="scrim"></div>
<nav id="drawer" class="drawer" aria-label="メニュー"></nav>
<div id="ptr"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></div>
<main id="app"></main>

<script>
// ===== 設定の保存(この端末のブラウザだけ。トークンは外に出さない) =====
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存できなくても動く */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* 同上 */ } },
};
const conn = { repo: LS.get("kb.repo") || "sinri-N/kabu-bunshin", token: LS.get("kb.token") || "" };
const SECTIONS = { summary: "サマリー(3つの数字)", chart: "推移グラフ", accounts: "仮想口座の保有・注文", fills: "最近の約定", real: "実際の保有(記録上)", news: "ニュース注意", watch: "登録銘柄" };
const CONFIG_FILES = ["config/paper_config.json", "config/portfolio_config.json", "config/margin_costs.json", "config/live_config.json"];
let prefs = readPrefs();
let tab = "home";
let cache = {};

function readPrefs() {
  let p = null;
  try { p = JSON.parse(LS.get("kb.prefs") || "null"); } catch (e) { p = null; }
  return normalizePrefs(p);
}
function normalizePrefs(p) {
  const known = Object.keys(SECTIONS);
  const order = ((p && p.order) || []).filter((k) => known.includes(k));
  known.forEach((k) => { if (!order.includes(k)) order.push(k); });
  return { order, hidden: ((p && p.hidden) || []).filter((k) => known.includes(k)), watch: ((p && p.watch) || []).filter((c) => /^\d{4}[A-Z]?$/.test(c)) };
}

// ===== 小さな部品 =====
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  kids.flat().forEach((c) => { if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return el;
}
const yen = (n) => (n == null || isNaN(n) ? "-" : Math.round(n).toLocaleString("ja-JP") + "円");
const pct = (n) => (n == null || isNaN(n) ? "-" : (n >= 0 ? "+" : "") + n.toFixed(2) + "%");
const signCls = (n) => (n > 0 ? "gain" : n < 0 ? "loss" : "");
const todayJst = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);

// ===== GitHub とのやりとり =====
async function gh(path, opts = {}) {
  // 古い内容が返らないよう、読み取りには毎回違う値を付ける(cache指定はGitHubのCORSで拒否されるので使わない)
  const bust = (opts.method || "GET") === "GET" ? (path.includes("?") ? "&" : "?") + "_=" + Date.now() : "";
  const res = await fetch(`https://api.github.com/repos/${conn.repo}${path ? "/" + path : ""}${bust}`, {
    ...opts,
    headers: { Authorization: `Bearer ${conn.token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) },
  });
  if (res.status === 204) return null;
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(body.message || res.statusText); e.status = res.status; throw e; }
  return body;
}
function decodeB64(b64) { const bin = atob(b64.replace(/\n/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))); }
function encodeB64(text) { let s = ""; new TextEncoder().encode(text).forEach((b) => { s += String.fromCharCode(b); }); return btoa(s); }
async function getFile(path) {
  try { const f = await gh(`contents/${path}?ref=main`); return { text: decodeB64(f.content), sha: f.sha }; }
  catch (e) { if (e.status === 404) return null; throw e; }
}
async function putFile(path, text, sha, message) {
  return gh(`contents/${path}`, { method: "PUT", body: JSON.stringify({ message, content: encodeB64(text), branch: "main", ...(sha ? { sha } : {}) }) });
}
function explain(e) {
  if (e.status === 401) return "トークンが正しくないか、期限が切れています。設定タブで入れ直してください。";
  if (e.status === 403) return "権限が足りないか、アクセスが多すぎます。トークンの権限(Contents / Actions)を確認してください。";
  if (e.status === 404) return "リポジトリまたはファイルが見つかりません。リポジトリ名とトークンの対象リポジトリを確認してください。";
  if (e.status === 409 || e.status === 422) return "他の更新と重なりました。読み込み直してからもう一度お試しください。";
  return `通信に失敗しました(${e.message})`;
}

// ===== 画面の骨組み =====
const app = document.getElementById("app");
const drawer = document.getElementById("drawer");
const menuBtn = document.getElementById("menuBtn");
const TABS = [["home", "ホーム"], ["record", "記録"], ["config", "設定"], ["run", "実行"]];
let onRefresh = null; // 引っ張って更新したときに呼ぶ処理(画面ごとに設定。nullなら無効)

const setMenu = (open) => document.body.classList.toggle("menu-open", open);
menuBtn.addEventListener("click", () => setMenu(true));
document.getElementById("scrim").addEventListener("click", () => setMenu(false));
addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });

function renderTabs() {
  menuBtn.hidden = !conn.token; document.getElementById("find").hidden = !conn.token;
  drawer.replaceChildren(h("h2", null, "分身体"), ...TABS.map(([id, label]) =>
    h("button", { "aria-current": tab === id ? "page" : null, onclick: () => { tab = id; setMenu(false); render(); window.scrollTo(0, 0); } }, label)));
}
function render() {
  onRefresh = null;
  renderTabs();
  if (!conn.token) return renderConnect();
  ({ home: renderHome, record: renderRecord, config: renderConfig, run: renderRun })[tab]();
}
function head(title, sub) {
  document.getElementById("title").textContent = title;
  document.title = title === "分身体" ? title : `${title} - 分身体`;
  return sub ? h("p", { class: "sub" }, sub) : document.createDocumentFragment();
}

// ===== 銘柄検索(上のバー): Yahooファイナンスで開く / 登録銘柄に入れる =====
const yahooUrl = (c) => `https://finance.yahoo.co.jp/quote/${c}.T`;
function matchStocks(raw, limit) {
  const q = raw.trim().replace(/\.T$/i, ""); if (!q || !nameMap) return [];
  const codes = Object.keys(nameMap);
  const hit = /^\d/.test(q) ? codes.filter((c) => c.startsWith(q.toUpperCase())) : codes.filter((c) => nameMap[c].includes(q));
  return hit.slice(0, limit);
}
async function setWatch(code, on) {
  prefs.watch = on ? [...new Set([...prefs.watch, code])] : prefs.watch.filter((c) => c !== code);
  LS.set("kb.prefs", JSON.stringify(prefs));
  try { const cur = await getFile("data/app_prefs.json"); const r = await putFile("data/app_prefs.json", JSON.stringify(prefs, null, 2) + "\n", cur ? cur.sha : null, "アプリ: 登録銘柄を更新"); cache.prefSha = r.content.sha; return null; }
  catch (e) { return "この端末には保存しましたが、共有はできませんでした。" + explain(e); }
}
function hitRow(c, after) {
  const on = prefs.watch.includes(c);
  return h("div", { class: "hit" }, h("div", { class: "who" }, h("span", { class: "num" }, c), " ", nameMap[c] || ""),
    h("div", { class: "acts" }, h("a", { class: "btn", href: yahooUrl(c), target: "_blank", rel: "noopener" }, "Yahoo"),
      h("button", { class: "btn" + (on ? " on" : ""), onclick: async () => { const err = await setWatch(c, !on); if (err) alert(err); after(); } }, on ? "登録済" : "登録")));
}
(function initSearch() {
  const q = document.getElementById("q"), res = document.getElementById("res");
  const refreshHome = () => { if (tab === "home" && onRefresh) renderHome(true); };
  function draw() {
    const raw = q.value.trim(); if (!raw) { res.hidden = true; return; }
    const codes = matchStocks(raw, 8);
    res.replaceChildren(...(codes.length ? codes.map((c) => hitRow(c, () => { draw(); refreshHome(); })) : [h("div", { class: "empty" }, nameMap ? "見つかりません" : "読み込み中...")]));
    res.hidden = false;
  }
  q.addEventListener("focus", () => { loadNames().then(draw).catch(() => {}); draw(); });
  q.addEventListener("input", draw);
  document.addEventListener("click", (e) => { if (!e.target.closest(".find")) res.hidden = true; });
  addEventListener("keydown", (e) => { if (e.key === "Escape") { res.hidden = true; q.blur(); } });
})();

// ===== 引っ張って更新(画面の一番上から下へ引く) =====
const ptr = document.getElementById("ptr");
let ptrStart = null, ptrDy = 0, ptrBusy = false;
function ptrShow(dy) {
  ptr.style.opacity = Math.min(dy / 60, 1);
  ptr.style.transform = `translate(-50%, ${Math.min(dy, 100) * 0.5 - 48}px)`;
  ptr.firstChild.style.transform = ptr.classList.contains("spin") ? "" : `rotate(${dy * 3}deg)`;
}
addEventListener("touchstart", (e) => {
  const ok = onRefresh && !ptrBusy && window.scrollY <= 0 && !document.body.classList.contains("menu-open") && !e.target.closest("textarea");
  ptrStart = ok ? e.touches[0].clientY : null; ptrDy = 0; ptr.classList.remove("snap");
}, { passive: true });
addEventListener("touchmove", (e) => {
  if (ptrStart == null) return;
  if (window.scrollY > 0) { ptrStart = null; ptrShow(0); return; }
  ptrDy = Math.max(0, e.touches[0].clientY - ptrStart); ptrShow(ptrDy);
}, { passive: true });
addEventListener("touchend", async () => {
  if (ptrStart == null) return;
  const go = ptrDy >= 70; ptrStart = null; ptr.classList.add("snap");
  if (!go) { ptrShow(0); return; }
  ptrBusy = true; ptr.classList.add("spin"); ptrShow(80); ptr.firstChild.style.transform = "";
  try { await onRefresh(); } catch (e) { /* 各画面がエラー表示を持つ */ }
  ptrBusy = false; ptr.classList.remove("spin"); ptrShow(0);
}, { passive: true });

// ===== つなぐ(初回) =====
function renderConnect() {

let nameMap = null; // 銘柄コード(4桁)→銘柄名。東証プライム一覧から作り、端末にも覚えておく
async function loadNames() {
  if (nameMap) return nameMap;
  try { nameMap = JSON.parse(LS.get("kb.names") || "null"); } catch (e) { nameMap = null; }
  if (nameMap) return nameMap;
  const f = await getFile("config/prime_universe.json");
  nameMap = {};
  if (f) Object.entries(JSON.parse(f.text).stocks || {}).forEach(([c, v]) => { nameMap[c.replace(/\.T$/i, "")] = v.name; });
  LS.set("kb.names", JSON.stringify(nameMap));

}

        waiting ? h("div", { class: "note", style: "margin-bottom:8px" }, `反映待ちが${waiting}件あります。`) : null,
        Array.isArray(failed) && failed.length ? h("div", { class: "err", style: "margin-bottom:8px" }, `記録できなかった依頼が${failed.length}件あります(data/inbox/failed に理由つきで残っています)。`) : null,
        rows.length ? rows.slice(0, 10).map((r) => h("div", { class: "row" }, h("span", null, r.t), h("span", { class: "mute num" }, r.d.slice(5)))) : h("div", { class: "mute" }, "まだ記録がありません。"));
    } catch (e) { history.replaceChildren(h("h2", null, "最近の記録"), h("div", { class: "err" }, explain(e))); }
  }
  app.replaceChildren(head("記録"), h("div", { class: "panel" }, box), status, history);
  draw(); loadHistory();
}

// ===== 設定(設定ファイルの編集) =====
function renderConfig() {
  let current = CONFIG_FILES[0]; let sha = null;
  const sel = h("select", { id: "file", onchange: () => { current = sel.value; load(); } }, CONFIG_FILES.map((p) => h("option", { value: p }, p.replace("config/", ""))));
  const ta = h("textarea", { id: "editor", spellcheck: "false", autocapitalize: "off" }); const msg = h("div");
  async function load() {
    msg.replaceChildren(); ta.value = "読み込み中..."; ta.disabled = true;
    try { const f = await getFile(current); sha = f ? f.sha : null; ta.value = f ? f.text : ""; } catch (e) { ta.value = ""; msg.replaceChildren(h("div", { class: "err" }, explain(e))); }
    ta.disabled = false;
  }
  async function save() {
    msg.replaceChildren();
    try { JSON.parse(ta.value); } catch (e) { msg.replaceChildren(h("div", { class: "err" }, "JSONの形が正しくありません: " + e.message)); return; }
    try { const r = await putFile(current, ta.value.endsWith("\n") ? ta.value : ta.value + "\n", sha, `アプリ: ${current} を更新`); sha = r.content.sha;
      msg.replaceChildren(h("div", { class: "okmsg" }, "保存しました。次の日次処理から反映されます。")); }
    catch (e) { msg.replaceChildren(h("div", { class: "err" }, explain(e))); }
  }
  app.replaceChildren(head("設定", "変更は次の日次処理から反映"),
    h("div", { class: "panel form" }, h("label", null, "ファイル", sel), ta,
      msg, h("div", { class: "actions" }, h("button", { class: "primary", onclick: save }, "保存"), h("button", { onclick: load }, "元に戻す"))),
    h("div", { class: "panel form" }, h("h2", null, conn.repo),
      h("div", { class: "actions" }, h("button", { onclick: () => { LS.del("kb.token"); conn.token = ""; render(); } }, "つなぎ直す"))));
  load();
}

// ===== 実行 =====
function renderRun() {
  onRefresh = () => loadRuns();
  const msg = h("div"); const runs = h("div", { class: "panel" }, h("h2", null, "最近の実行"), h("div", { class: "mute" }, "読み込み中..."));
  async function dispatch(file, inputs, label) {
    msg.replaceChildren();
    try { await gh(`actions/workflows/${file}/dispatches`, { method: "POST", body: JSON.stringify({ ref: "main", inputs }) });
      msg.replaceChildren(h("div", { class: "okmsg" }, `${label}を開始しました。数分かかります(下に引っ張ると更新)。`)); setTimeout(loadRuns, 4000); }
    catch (e) { msg.replaceChildren(h("div", { class: "err" }, explain(e))); }
  }
  async function loadRuns() {
    try { const r = await gh("actions/runs?per_page=8");
      const label = (x) => (x.status !== "completed" ? ["実行中", "run"] : x.conclusion === "success" ? ["成功", "success"] : x.conclusion === "failure" ? ["失敗", "failure"] : [x.conclusion || "-", ""]);
      runs.replaceChildren(h("h2", null, "最近の実行"), r.workflow_runs.length ? r.workflow_runs.map((x) => { const [t, c] = label(x);
        return h("div", { class: "row" }, h("span", null, `${x.name}(${x.event === "schedule" ? "定時" : x.event === "push" ? "記録" : "手動"})`),
          h("span", null, h("span", { class: `chip ${c}` }, t), " ", h("span", { class: "mute num" }, new Date(x.created_at).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })))); }) : h("div", { class: "mute" }, "まだ実行がありません。"));
    } catch (e) { runs.replaceChildren(h("h2", null, "最近の実行"), h("div", { class: "err" }, explain(e))); }
  }
  app.replaceChildren(head("実行", "自動更新: 平日 9:30 / 13:00 / 18:00"),
    h("div", { class: "panel form" },
      h("button", { class: "primary", onclick: () => dispatch("daily.yml", { init: "false", month_end_force: "false" }, "日次処理") }, "日次処理を今すぐ実行"),
      h("button", { onclick: () => dispatch("daily.yml", { init: "false", month_end_force: "true" }, "月次の入れ替え提案") }, "月次の入れ替え提案も実行")),
    msg, runs);
  loadRuns();
}

render();
</script>
</body>
</html>
