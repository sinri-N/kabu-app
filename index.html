  --c1: #8fb0e6; --c2: #e0a04a; --c3: #8f97a6; --c4: #6fcf9f; --line: #3d4559; --shadow: 0 2px 10px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .04); color-scheme: dark; } }

  --bg: #151922; --panel: #1c212c; --ink: #e6e8ee; --mute: #98a1b2; --line: #2d3443;
  --accent: #8fb0e6; --on-accent: #101626; --gain: #ef7d70; --loss: #7fb2ee;

<script>
// ===== 設定の保存(この端末のブラウザだけ。トークンは外に出さない) =====
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存できなくても動く */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* 同上 */ } },

// 表示テーマ: auto(端末に合わせる) / light / dark。この端末だけに覚えておく
function applyTheme(t) { if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
applyTheme(LS.get("kb.theme"));
const conn = { repo: LS.get("kb.repo") || "sinri-N/kabu-bunshin", token: LS.get("kb.token") || "" };
const SECTIONS = { summary: "サマリー(3つの数字)", chart: "推移グラフ", accounts: "仮想口座の保有・注文", fills: "最近の約定", real: "実際の保有(記録上)", news: "ニュース注意", watch: "登録銘柄" };
const CONFIG_FILES = ["config/paper_config.json", "config/portfolio_config.json", "config/margin_costs.json", "config/live_config.json"];
let prefs = readPrefs();
let tab = "home";
let cache = {};

function readPrefs() {
  let p = null;
  try { p = JSON.parse(LS.get("kb.prefs") || "null"); } catch (e) { p = null; }
  return normalizePrefs(p);
}
function normalizePrefs(p) {
  const known = Object.keys(SECTIONS);
  const order = ((p && p.order) || []).filter((k) => known.includes(k));
  known.forEach((k) => { if (!order.includes(k)) order.push(k); });
  return { order, hidden: ((p && p.hidden) || []).filter((k) => known.includes(k)), watch: ((p && p.watch) || []).filter((c) => /^\d{4}[A-Z]?$/.test(c)) };
}

// ===== 小さな部品 =====
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);

// ===== GitHub とのやりとり =====
async function gh(path, opts = {}) {
  // 古い内容が返らないよう、読み取りには毎回違う値を付ける(cache指定はGitHubのCORSで拒否されるので使わない)
  const bust = (opts.method || "GET") === "GET" ? (path.includes("?") ? "&" : "?") + "_=" + Date.now() : "";
  const res = await fetch(`https://api.github.com/repos/${conn.repo}${path ? "/" + path : ""}${bust}`, {
    ...opts,
    headers: { Authorization: `Bearer ${conn.token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) },
  });
  if (res.status === 204) return null;
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(body.message || res.statusText); e.status = res.status; throw e; }
  return body;
}

function encodeB64(text) { let s = ""; new TextEncoder().encode(text).forEach((b) => { s += String.fromCharCode(b); }); return btoa(s); }

  try { const f = await gh(`contents/${path}?ref=main`); return { text: decodeB64(f.content), sha: f.sha }; }
  catch (e) { if (e.status === 404) return null; throw e; }
}
async function putFile(path, text, sha, message) {
  return gh(`contents/${path}`, { method: "PUT", body: JSON.stringify({ message, content: encodeB64(text), branch: "main", ...(sha ? { sha } : {}) }) });
}
function explain(e) {
  if (e.status === 401) return "トークンが正しくないか、期限が切れています。設定タブで入れ直してください。";
  if (e.status === 403) return "権限が足りないか、アクセスが多すぎます。トークンの権限(Contents / Actions)を確認してください。";
  if (e.status === 404) return "リポジトリまたはファイルが見つかりません。リポジトリ名とトークンの対象リポジトリを確認してください。";
  if (e.status === 409 || e.status === 422) return "他の更新と重なりました。読み込み直してからもう一度お試しください。";
  return `通信に失敗しました(${e.message})`;
}

  async function load() {
    msg.replaceChildren(); ta.value = "読み込み中..."; ta.disabled = true;
    try { const f = await getFile(current); sha = f ? f.sha : null; ta.value = f ? f.text : ""; } catch (e) { ta.value = ""; msg.replaceChildren(h("div", { class: "err" }, explain(e))); }
    ta.disabled = false;
  }
  async function save() {
    msg.replaceChildren();
    try { JSON.parse(ta.value); } catch (e) { msg.replaceChildren(h("div", { class: "err" }, "JSONの形が正しくありません: " + e.message)); return; }
    try { const r = await putFile(current, ta.value.endsWith("\n") ? ta.value : ta.value + "\n", sha, `アプリ: ${current} を更新`); sha = r.content.sha;
      msg.replaceChildren(h("div", { class: "okmsg" }, "保存しました。次の日次処理から反映されます。")); }
    catch (e) { msg.replaceChildren(h("div", { class: "err" }, explain(e))); }
  }
  app.replaceChildren(head("設定", "変更は次の日次処理から反映"),
    h("div", { class: "panel form" }, h("label", null, "ファイル", sel), ta,
      msg, h("div", { class: "actions" }, h("button", { class: "primary", onclick: save }, "保存"), h("button", { onclick: load }, "元に戻す"))),
    h("div", { class: "panel form" }, h("h2", null, "表示テーマ"),
      h("div", { class: "themes", role: "group", "aria-label": "表示テーマ" }, [["auto", "自動"], ["light", "ライト"], ["dark", "ダーク"]].map(([k, label]) =>
        h("button", { "aria-pressed": String((LS.get("kb.theme") || "auto") === k), onclick: () => { LS.set("kb.theme", k); applyTheme(k); renderConfig(); } }, label)))),
    h("div", { class: "panel form" }, h("h2", null, conn.repo),
      h("div", { class: "actions" }, h("button", { onclick: () => { LS.del("kb.token"); conn.token = ""; render(); } }, "つなぎ直す"))));
  load();
}

// ===== 実行 =====
function renderRun() {
  onRefresh = () => loadRuns();
  const msg = h("div"); const runs = h("div", { class: "panel" }, h("h2", null, "最近の実行"), h("div", { class: "mute" }, "読み込み中..."));
  async function dispatch(file, inputs, label) {
    msg.replaceChildren();
    try { await gh(`actions/workflows/${file}/dispatches`, { method: "POST", body: JSON.stringify({ ref: "main", inputs }) });
      msg.replaceChildren(h("div", { class: "okmsg" }, `${label}を開始しました。数分かかります(下に引っ張ると更新)。`)); setTimeout(loadRuns, 4000); }
    catch (e) { msg.replaceChildren(h("div", { class: "err" }, explain(e))); }
  }
  async function loadRuns() {
    try { const r = await gh("actions/runs?per_page=8");
      const label = (x) => (x.status !== "completed" ? ["実行中", "run"] : x.conclusion === "success" ? ["成功", "success"] : x.conclusion === "failure" ? ["失敗", "failure"] : [x.conclusion || "-", ""]);
      runs.replaceChildren(h("h2", null, "最近の実行"), r.workflow_runs.length ? r.workflow_runs.map((x) => { const [t, c] = label(x);
        return h("div", { class: "row" }, h("span", null, `${x.name}(${x.event === "schedule" ? "定時" : x.event === "push" ? "記録" : "手動"})`),
          h("span", null, h("span", { class: `chip ${c}` }, t), " ", h("span", { class: "mute num" }, new Date(x.created_at).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })))); }) : h("div", { class: "mute" }, "まだ実行がありません。"));
    } catch (e) { runs.replaceChildren(h("h2", null, "最近の実行"), h("div", { class: "err" }, explain(e))); }
  }
  app.replaceChildren(head("実行", "自動更新: 平日 9:30 / 13:00 / 18:00"),
    h("div", { class: "panel form" },
      h("button", { class: "primary", onclick: () => dispatch("daily.yml", { init: "false", month_end_force: "false" }, "日次処理") }, "日次処理を今すぐ実行"),
      h("button", { onclick: () => dispatch("daily.yml", { init: "false", month_end_force: "true" }, "月次の入れ替え提案") }, "月次の入れ替え提案も実行")),
    msg, runs);
  loadRuns();
}

render();
</script>
</body>
</html>
